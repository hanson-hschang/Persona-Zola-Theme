<footer id="footer" class="footer position-relative">
  <div class="container">
    <p class="footer__sitename">{{ config.title }}</p>
    <p class="footer__quote">{{ config.extra.persona.quote }}</p>
    <nav class="footer__social-links d-flex justify-content-center" aria-label="Social links">
      {% include "partials/social-icon.html" %}
    </nav>
    <div class="container">
      <div class="footer__copyright">{{ config.extra.persona.copyright | markdown | safe }}</div>
      <div class="footer__credits">{{ config.extra.persona.credits | markdown | safe }}</div>
    </div>
  </div>
</footer>
