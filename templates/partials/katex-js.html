<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const katexMacros = {{ page.extra.tex.macros | default(value={}) | json_encode | safe }};
    const mathOptions = {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\[', right: '\\]', display: true},
        {left: '\\(', right: '\\)', display: false},
      ],
      macros: katexMacros
    };
    const protectedMath = {{ page.content is containing(pat="<!-- persona-math-protected -->") | json_encode | safe }};
    if (protectedMath) {
      // Only recognized math is rendered inside processed prose. Otherwise
      // Markdown's decoded \$ would be mistaken for a new math delimiter.
      document.querySelectorAll('.post__prose .persona-math').forEach(function(element) {
        renderMathInElement(element, mathOptions);
      });
      // Component captions are rendered by Tera after body preprocessing.
      document.querySelectorAll('.post__prose figcaption').forEach(function(element) {
        renderMathInElement(element, { ...mathOptions, ignoredClasses: ['persona-math'] });
      });
      renderMathInElement(document.body, { ...mathOptions, ignoredClasses: ['post__prose'] });
    } else {
      renderMathInElement(document.body, mathOptions);
    }
  });
</script>
