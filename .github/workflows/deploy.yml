name: Build and Deploy GH Pages

on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Job 1: Runs ONLY on Pull Requests to verify the site builds successfully
  test-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install citation processor
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Prepare Markdown, equations, and citations
        run: python3 -B scripts/persona.py prepare --root . --output .persona-build
      - name: test_build
        uses: shalzz/zola-deploy-action@v0.23.4
        env:
          BUILD_DIR: .persona-build
          BUILD_THEMES: false
          BUILD_ONLY: true

  # Job 2: Runs ONLY on merges/pushes to main (or manual triggers) to deploy
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install citation processor
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Prepare Markdown, equations, and citations
        run: python3 -B scripts/persona.py prepare --root . --output .persona-build
      - name: build_and_deploy
        uses: shalzz/zola-deploy-action@v0.23.4
        env:
          BUILD_DIR: .persona-build
          BUILD_THEMES: false
          PAGES_BRANCH: gh-pages
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
